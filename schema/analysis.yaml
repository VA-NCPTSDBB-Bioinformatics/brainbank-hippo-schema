id: https://w3id.org/VA-NCPTSDBB/brainbank/analysis
name: analysis
description: >-
  Computational provenance. An Analysis is a core.Activity that consumes Datasets and produces
  Datasets (the dataset<->dataset transformation, reified through the activity node exactly as the
  sample<->dataset relation is reified through Assay; see DESIGN.md 2.2). Workflow is_a Analysis:
  an engine-driven run (nextflow / snakemake / CWL / WDL) carrying its pipeline identity. Intra-run
  steps (a nextflow process / snakemake rule) are deferred behind the self-referential
  parent_analysis seam.
prefixes:
  linkml: https://w3id.org/linkml/
default_prefix: analysis
default_range: string
imports:
  - linkml:types
  - core
  - dataset

classes:
  Analysis:
    is_a: Activity
    description: >-
      A computational process: consumes input Datasets and produces output Datasets. Base for any
      analysis step; engine-driven pipelines are the Workflow subclass. protocol/performed_on are
      inherited from core.Activity.
    attributes:
      input_datasets:
        range: Dataset
        multivalued: true
        description: Datasets consumed by this analysis.
      output_datasets:
        range: Dataset
        multivalued: true
        description: >-
          Datasets produced by this analysis. Each such Dataset should also point back via
          produced_by -> this Analysis.
      parameters:
        range: Parameter
        multivalued: true
        inlined_as_list: true
        description: Parameters/settings supplied to the run.
      started_at:
        range: datetime
      ended_at:
        range: datetime
      status:
        range: AnalysisStatus
      compute_environment:
        description: Free-text description of where/how it ran (cluster, cloud, profile).
      parent_analysis:
        range: Analysis
        description: >-
          Enclosing analysis, if this is a sub-step. SEAM for future fine-grained provenance
          (a nextflow process / snakemake rule); not built out in the prototype.

  Workflow:
    is_a: Analysis
    description: >-
      An engine-driven workflow run (e.g. nf-core/rnaseq, a Snakemake pipeline). Carries the
      pipeline identity in addition to the inherited Analysis run fields. Note: because each run is
      its own Workflow instance, pipeline identity (repository_url / pipeline_version) repeats per
      run rather than living in one reusable definition (a deliberate subclass-over-slot choice).
    attributes:
      engine:
        range: WorkflowEngine
        required: true
      repository_url:
        range: uriorcurie
        description: Where the pipeline source lives (e.g. the nf-core/Snakemake-workflows repo).
      pipeline_version:
        description: Pipeline release tag or commit (e.g. nf-core/rnaseq 3.14.0).
      engine_version:
        description: Version of the workflow engine itself (e.g. Nextflow 23.10.1).
      container_image:
        description: Container image/digest the run executed in, if any.

  Parameter:
    is_a: NamedThing
    description: A single named parameter/setting supplied to an analysis.
    slot_usage:
      name:
        description: Parameter name.
    attributes:
      value:
        description: Parameter value (serialized as text in the prototype).

enums:
  AnalysisStatus:
    permissible_values:
      completed: {}
      failed: {}
      running: {}
      queued: {}
  WorkflowEngine:
    permissible_values:
      nextflow: {}
      snakemake: {}
      CWL: {}
      WDL: {}
      bash: {}
      other: {}
