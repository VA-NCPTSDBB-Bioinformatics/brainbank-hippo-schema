id: https://w3id.org/VA-NCPTSDBB/brainbank/anatomy
name: anatomy
version: 0.1.0
description: >-
  Anatomical vocabulary. AnatomicalSite is a dynamic enum bound to Uberon; AnatomicalStructure
  is a thin curated term class used when local metadata or an FMA cross-reference is needed
  (e.g. when Uberon is not specific enough).
prefixes:
  linkml: https://w3id.org/linkml/
  uberon: http://purl.obolibrary.org/obo/UBERON_
  fma: http://purl.org/sig/ont/fma/fma
default_prefix: anatomy
default_range: string
imports:
  - linkml:types
  - core

classes:
  AnatomicalStructure:
    is_a: NamedThing
    description: >-
      A curated anatomical term. `name` is the preferred label; `ontology_term` binds to Uberon;
      `fma_xref` records an FMA cross-reference when Uberon lacks a specific-enough term.
    attributes:
      ontology_term:
        range: AnatomicalSite
        description: The bound Uberon term for this anatomical structure.
      fma_xref:
        range: uriorcurie
        multivalued: true
        description: FMA cross-reference(s), used when Uberon is not specific enough.
      part_of:
        range: AnatomicalStructure
        description: The parent anatomical structure this structure is a part of (mereological relation).

enums:
  AnatomicalSite:
    description: Anatomical structures drawn from the Uberon multi-species anatomy ontology.
    reachable_from:
      source_ontology: obo:uberon
      source_nodes:
        - UBERON:0000465   # material anatomical entity (confirm root with ontologist)
      relationship_types:
        - rdfs:subClassOf
        - BFO:0000050      # part_of
