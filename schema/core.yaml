id: https://w3id.org/VA-NCPTSDBB/brainbank/core
name: core
description: Shared base classes, quantities, units, and prefixes for the brain bank schema.
prefixes:
  linkml: https://w3id.org/linkml/
  brainbank: https://w3id.org/VA-NCPTSDBB/brainbank/
  uberon: http://purl.obolibrary.org/obo/UBERON_
  mondo: http://purl.obolibrary.org/obo/MONDO_
  ncbitaxon: http://purl.obolibrary.org/obo/NCBITaxon_
  cl: http://purl.obolibrary.org/obo/CL_
  obi: http://purl.obolibrary.org/obo/OBI_
  ro: http://purl.obolibrary.org/obo/RO_
  UO: http://purl.obolibrary.org/obo/UO_
  prov: http://www.w3.org/ns/prov#
default_prefix: core
default_range: string
imports:
  - linkml:types

classes:
  NamedThing:
    abstract: true
    description: >-
      Local base for all entities. TEMPORARY: stands in for hippo's runtime-provided
      Entity (see DESIGN.md section 7). When we adopt hippo, classes switch to
      `is_a: Entity` and id/name/description here are surrendered to the runtime.
    attributes:
      id:
        identifier: true
        range: uriorcurie
        description: Technical identifier (UUID/CURIE); becomes hippo-managed later.
      name:
        required: true
        description: Human-readable label for the entity.
      description:
        description: Free-text narrative description of the entity.
      category:
        designates_type: true
        range: string
        description: >-
          Names the concrete class of this instance. Lets polymorphic inlined collections
          (e.g. a `samples` list holding SolidSample/LiquidSample) instantiate the right subclass.

  Association:
    abstract: true
    is_a: NamedThing
    description: Reified, Biolink-style relationship carrying scientific metadata only (never DB audit).
    attributes:
      subject:
        range: NamedThing
        required: true
        description: The entity playing the subject role in this relationship.
      predicate:
        range: uriorcurie
        description: Relation Ontology predicate, e.g. RO:0001000 'derives from'.
      object:
        range: NamedThing
        required: true
        description: The entity playing the object role in this relationship.
      evidence_type:
        description: Type of evidence supporting this association (free text; formalize later).
      method:
        description: Method or approach used to establish this association.
      asserted_on:
        range: date
        description: Date on which this association was first asserted or recorded.

  Protocol:
    is_a: NamedThing
    description: An SOP or method document (was tissue_db:SOP).
    attributes:
      document_location:
        required: true
        description: URL, directory, or other location where the SOP can be found.
      version:
        required: true
        description: Version string for this SOP or method document.

  Activity:
    abstract: true
    is_a: NamedThing
    exact_mappings:
      - prov:Activity
    description: >-
      A PROV-style activity: something that occurs over time and acts on entities — specimen
      processing (tissue.Process), data acquisition (dataset.Assay), or computation
      (analysis.Analysis). Holds only what every activity shares; typed inputs/outputs live on
      the subclasses because their ranges differ (Sample vs Dataset).
    attributes:
      protocol:
        range: Protocol
        recommended: true
        description: The SOP/method this activity followed.
      performed_on:
        range: date
        description: Date the activity was carried out.

  Quantity:
    abstract: true
    description: Abstract base for a numeric measurement paired with a unit.
    attributes:
      value:
        range: float
        description: Numeric magnitude of the measurement.
  Mass:
    is_a: Quantity
    description: A mass measurement (e.g. tissue weight).
    attributes:
      unit:
        range: MassUnit
        description: Unit of mass for this measurement.
  Volume:
    is_a: Quantity
    description: A volume measurement (e.g. aliquot volume).
    attributes:
      unit:
        range: VolumeUnit
        description: Unit of volume for this measurement.
  Concentration:
    is_a: Quantity
    description: A concentration measurement (e.g. RNA/DNA concentration in ng/µL).
    attributes:
      unit:
        range: ConcentrationUnit
        description: Unit of concentration for this measurement.

enums:
  MassUnit:
    description: SI-derived units of mass used for specimen and extract measurements.
    permissible_values:
      ng:
        description: Nanogram (10⁻⁹ g); typical for trace nucleic-acid quantities.
        meaning: UO:0000024
      ug:
        description: Microgram (10⁻⁶ g).
        meaning: UO:0000023
      mg:
        description: Milligram (10⁻³ g); typical for tissue block weights.
        meaning: UO:0000022
      g:
        description: Gram.
        meaning: UO:0000021
      kg:
        description: Kilogram (10³ g); used for whole-organ weights.
        meaning: UO:0000009
  VolumeUnit:
    description: SI-derived units of volume used for liquid sample and aliquot measurements.
    permissible_values:
      nl:
        description: Nanoliter (10⁻⁹ L); used for ultra-small assay volumes.
        meaning: UO:0000102
      ul:
        description: Microliter (10⁻⁶ L); typical for aliquot volumes.
        meaning: UO:0000101
      ml:
        description: Milliliter (10⁻³ L); typical for CSF and blood aliquots.
        meaning: UO:0000098
      l:
        description: Liter; used for large bulk volumes.
        meaning: UO:0000099
  ConcentrationUnit:
    description: Units of mass-per-volume concentration used for nucleic-acid and protein extracts.
    permissible_values:
      ng_ul:
        description: Nanograms per microliter; standard unit for RNA/DNA concentration (e.g. NanoDrop output).
      ug_ul:
        description: Micrograms per microliter; higher-range concentration unit.
      mg_ml:
        description: Milligrams per milliliter; typical unit for protein concentrations.
