site_name: brainbank-hippo-schema
site_description: LinkML schema for the VA National Center for PTSD Brain Bank data store
site_url: https://va-ncptsdbb-bioinformatics.github.io/brainbank-hippo-schema/
repo_url: https://github.com/VA-NCPTSDBB-Bioinformatics/brainbank-hippo-schema
repo_name: VA-NCPTSDBB-Bioinformatics/brainbank-hippo-schema

theme:
  name: material
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - search.highlight
    - content.code.copy
  palette:
    - scheme: default
      primary: indigo
      accent: indigo

markdown_extensions:
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - admonition
  - toc:
      permalink: true

docs_dir: docs

nav:
  - Home: index.md
  - Cookbook: cookbook.md
  - Diagrams: diagrams.md
  - Mappings: mappings.md
  - Reference:
    - Index: gen/index.md
