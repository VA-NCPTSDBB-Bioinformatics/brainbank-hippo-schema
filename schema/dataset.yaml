id: https://w3id.org/VA-NCPTSDBB/brainbank/dataset
name: dataset
description: >-
  Assay-output / dataset domain. Datasets and assays are modeled with typed subclasses per assay
  family (transcriptomics, genomics, epigenomics, imaging). Shared technology bases
  (SequencingAssay / ArrayAssay / SequenceDataset) cut duplication. The sample<->dataset
  many-to-many is reified through the Assay process node (see DESIGN.md 2.2).
prefixes:
  linkml: https://w3id.org/linkml/
  obi: http://purl.obolibrary.org/obo/OBI_
default_prefix: dataset
default_range: string
imports:
  - linkml:types
  - core
  - tissue

classes:
  # ---------------- Datasets (the data artifacts) ----------------
  Dataset:
    is_a: NamedThing
    description: >-
      A data artifact (scientific unit). Its physical bytes live in File/FileSet objects;
      its provenance is produced_by -> Activity (an Assay for raw data, or an Analysis/Workflow
      for derived data). A Dataset has no derived_from-sample slot; source samples are reached
      via produced_by -> Assay -> inputs.
    attributes:
      dataset_id:
        required: true
      assay_type:
        range: AssayType
      data_location:
        range: uriorcurie
        description: >-
          Optional convenience pointer to the dataset root (e.g. a directory or DRS bundle URI).
          Per-file locations/formats live on the File objects in `files`/`file_sets`.
      files:
        range: File
        multivalued: true
        description: The individual files that make up this dataset.
      file_sets:
        range: FileSet
        multivalued: true
        description: Named groupings of files (e.g. paired reads, alignment + index).
      produced_by:
        range: Activity
        recommended: true
        description: >-
          The activity that produced this dataset — an Assay (raw acquisition) or an
          Analysis/Workflow (computation). Links the dataset to its inputs.

  SequenceDataset:
    abstract: true
    is_a: Dataset
    description: Common fields for sequencing-derived datasets.
    attributes:
      genome_build:
        range: GenomeBuild
      n_reads:
        range: integer

  RNASeqDataset:
    is_a: SequenceDataset
    description: Transcriptomics (bulk or single-nucleus) expression output.
    attributes:
      quantification:
        range: RNAQuantification
      gene_model:
        description: Annotation/gene model used (e.g. GENCODE release).

  GenomeVariantDataset:
    is_a: SequenceDataset
    description: WGS / WES variant output.
    attributes:
      sequencing_strategy:
        range: SequencingStrategy
      variant_caller: {}
      n_variants:
        range: integer

  ATACSeqDataset:
    is_a: SequenceDataset
    description: Chromatin-accessibility (ATAC-seq) output.
    attributes:
      peak_caller: {}
      n_peaks:
        range: integer

  ArrayDataset:
    abstract: true
    is_a: Dataset
    description: Common fields for microarray-derived datasets.
    attributes:
      array_platform:
        range: ArrayPlatform

  GenotypingDataset:
    is_a: ArrayDataset
    description: SNP-array genotyping output.
    attributes:
      genome_build:
        range: GenomeBuild
      n_variants:
        range: integer

  MethylationDataset:
    is_a: ArrayDataset
    description: Array-based DNA methylation output.
    attributes:
      n_probes:
        range: integer

  ImageDataset:
    is_a: Dataset
    description: Histology / IHC image (e.g. whole-slide image).
    attributes:
      image_format:
        range: ImageFormat
      stain:
        range: StainType
      magnification:
        range: float
      pixel_size_um:
        range: float

  # ---------------- Files (the physical layer under a Dataset) ----------------
  File:
    is_a: NamedThing
    description: A single physical data file. The atomic unit beneath a Dataset.
    attributes:
      uri:
        range: uriorcurie
        required: true
        description: Location of the file (path, URL, or DRS id).
      file_format:
        range: FileFormat
        description: Bioinformatics format of the file.
      media_type:
        description: IANA media (MIME) type, e.g. application/gzip.
      size_bytes:
        range: integer
      checksum:
        description: Checksum value for integrity/identity.
      checksum_algorithm:
        range: ChecksumAlgorithm

  FileSet:
    is_a: NamedThing
    description: >-
      A named bundle of files that belong together (e.g. R1/R2 FASTQs, a BAM + its index,
      a directory of per-sample VCFs). Optional grouping layer between Dataset and File.
    attributes:
      files:
        range: File
        multivalued: true
        required: true
      role:
        range: FileRole
        description: What this set of files represents within the dataset.

  # ---------------- Assays (the process nodes) ----------------
  Assay:
    is_a: Activity
    description: >-
      An assay run: the process node that consumes input Samples and produces Datasets. Reifies the
      many-to-many sample<->dataset relationship and carries its production metadata.
      protocol/performed_on are inherited from core.Activity.
    attributes:
      assay_type:
        range: AssayType
      inputs:
        range: Sample
        multivalued: true
        description: Source samples consumed by this assay.

  SequencingAssay:
    abstract: true
    is_a: Assay
    attributes:
      platform:
        range: SequencingPlatform
      read_length:
        range: integer
      paired_end:
        range: boolean
  RNASeqAssay:
    is_a: SequencingAssay
  GenomeSequencingAssay:
    is_a: SequencingAssay
    attributes:
      sequencing_strategy:
        range: SequencingStrategy
  ATACSeqAssay:
    is_a: SequencingAssay

  ArrayAssay:
    abstract: true
    is_a: Assay
    attributes:
      array_platform:
        range: ArrayPlatform
  GenotypingAssay:
    is_a: ArrayAssay
  MethylationArrayAssay:
    is_a: ArrayAssay

  ImagingAssay:
    is_a: Assay
    attributes:
      stain:
        range: StainType
      magnification:
        range: float
      scanner: {}

enums:
  AssayType:
    reachable_from:
      source_ontology: obo:obi
      source_nodes:
        - OBI:0000070      # assay
  FileFormat:
    description: Common bioinformatics file formats. First cut — extend as needed.
    permissible_values:
      FASTQ: {}
      BAM: {}
      CRAM: {}
      SAM: {}
      VCF: {}
      BCF: {}
      BED: {}
      GFF: {}
      GTF: {}
      TSV: {}
      CSV: {}
      H5AD: {}
      MTX: {}
      Parquet: {}
      Other: {}
  FileRole:
    description: The role a file/file-set plays within a dataset.
    permissible_values:
      reads: {}
      alignment: {}
      index: {}
      variants: {}
      counts: {}
      qc: {}
      log: {}
      report: {}
      reference: {}
      other: {}
  ChecksumAlgorithm:
    permissible_values:
      md5: {}
      sha1: {}
      sha256: {}
  SequencingPlatform:
    permissible_values:
      Illumina: {}
      PacBio: {}
      Oxford Nanopore: {}
      BGI: {}
      Other: {}
  ArrayPlatform:
    permissible_values:
      Illumina Infinium EPIC: {}
      Illumina 450K: {}
      Affymetrix SNP 6.0: {}
      Other: {}
  GenomeBuild:
    permissible_values:
      GRCh38: {}
      GRCh37: {}
      T2T-CHM13: {}
      Other: {}
  RNAQuantification:
    permissible_values:
      raw_counts: {}
      TPM: {}
      FPKM: {}
      CPM: {}
  SequencingStrategy:
    permissible_values:
      WGS: {}
      WES: {}
      targeted: {}
  ImageFormat:
    permissible_values:
      SVS: {}
      OME-TIFF: {}
      TIFF: {}
      NDPI: {}
      DICOM: {}
      JPEG: {}
      PNG: {}
