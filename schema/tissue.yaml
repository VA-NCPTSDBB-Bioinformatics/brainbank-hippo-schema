id: https://w3id.org/VA-NCPTSDBB/brainbank/tissue
name: tissue
version: 0.1.0
description: Physical specimen domain, logistics, and the generic processing-event backbone.
prefixes:
  linkml: https://w3id.org/linkml/
default_prefix: tissue
default_range: string
imports:
  - linkml:types
  - core
  - person
  - anatomy

classes:
  Sample:
    abstract: true
    is_a: NamedThing
    description: >-
      An abstract physical specimen obtained from a donor. Concrete subclasses are
      SolidSample and LiquidSample; brain-bank material types (CNSSection, CSF, Blood, …)
      extend those in the brainbank extension layer.
    attributes:
      sample_id:
        required: true
        description: Business identifier (human-facing sample/specimen ID).
      donor:
        range: Donor
        required: true
        description: The deceased donor this sample was taken from.
      anatomical_site:
        range: AnatomicalStructure
        multivalued: true
        description: Anatomical region(s) from which this sample was collected.
      container:
        range: Container
        description: The storage container currently holding this sample.
      derived_from:
        range: Sample
        description: Parent specimen this sample was produced from.
      produced_by:
        range: Process
        description: The processing event that created this sample.

  SolidSample:
    is_a: Sample
    description: A solid or semi-solid tissue specimen (e.g. a tissue block, section, or slab).
    attributes:
      format:
        range: SolidSampleFormat
        required: true
        description: Physical format of this solid specimen (e.g. Slab, Block, Section).
      mass:
        range: Mass
        description: Mass of the specimen.
    slot_usage:
      derived_from:
        range: SolidSample

  LiquidSample:
    is_a: Sample
    description: A liquid biological specimen or extract (e.g. CSF, blood aliquot, nucleic-acid extract).
    attributes:
      format:
        range: LiquidSampleFormat
        description: Aliquot format of this liquid specimen.
      volume:
        range: Volume
        description: Volume of the liquid specimen.
    slot_usage:
      derived_from:
        range: LiquidSample

  Container:
    is_a: NamedThing
    description: A physical storage container (tube, box, freezer, etc.) that holds one or more samples.
    attributes:
      type:
        range: ContainerType
        description: Type of storage container (e.g. Cryovial, Box, Freezer).
      location:
        range: Location
        description: Physical location where this container is stored.
      parent:
        range: Container
        description: Parent container this container is nested within (e.g. box within freezer).
      child_containers:
        range: Container
        multivalued: true
        inverse: parent
        description: >-
          Containers nested directly within this one (e.g. boxes in a freezer). Read-only reverse of `Container.parent`: derived from that slot, never
          stored or written (Mosaic ADR-0011).

  Location:
    is_a: NamedThing
    description: A physical storage location (room, freezer unit, building, site).
    attributes:
      location_type:
        range: LocationType
        description: Type of location (Site, Building, or Room).
      parent_location:
        range: Location
        description: The parent location this location belongs to (e.g. room within building).
      child_locations:
        range: Location
        multivalued: true
        inverse: parent_location
        description: >-
          Locations directly within this one (e.g. rooms in a building). Read-only reverse of `Location.parent_location`: derived from that slot, never
          stored or written (Mosaic ADR-0011).
      containers:
        range: Container
        multivalued: true
        inverse: location
        description: >-
          Containers stored at this location. Read-only reverse of `Container.location`: derived from that slot, never
          stored or written (Mosaic ADR-0011).

  Process:
    is_a: Activity
    description: >-
      A specimen-processing/transformation event (generalizes tissue_db:Transaction).
      Concrete brain-bank workflows subclass this in the brainbank extension layer.
      protocol/performed_on are inherited from core.Activity.
    attributes:
      inputs:
        range: Sample
        multivalued: true
        description: Input specimens consumed or transformed by this process.
      outputs:
        range: Sample
        multivalued: true
        description: Specimens produced as output of this process.

enums:
  SolidSampleFormat:
    description: Physical format categories for solid tissue specimens.
    permissible_values:
      Slab:
        description: A thick, unsectioned cut of tissue.
      Coronal slab:
        description: A slab cut in the coronal plane.
      Block:
        description: A tissue block prepared for further sectioning (e.g. paraffin or frozen block).
      Cassette:
        description: Tissue enclosed in a histology processing cassette.
      Section:
        description: A thin tissue section cut from a block.
      Pellet:
        description: A cell or tissue pellet (e.g. from centrifugation).
      Roll:
        description: Tissue rolled into a cylinder format (sometimes used for gut or thin-sheet tissue).
      Hemisphere:
        description: A cerebral hemisphere.
      Whole brain:
        description: An intact whole brain specimen.
      Remainder:
        description: The leftover tissue after other portions have been distributed.
  LiquidSampleFormat:
    description: Format categories for liquid biological specimens and extracts.
    permissible_values:
      Aliquot:
        description: A measured sub-volume distributed from a larger stock.
      Remainder:
        description: The residual volume remaining after aliquots have been taken.
  ContainerType:
    description: Types of physical storage containers used in the brain bank.
    permissible_values:
      Box:
        description: A storage box (typically holds multiple tubes or vials).
      Falcon Tube:
        description: A conical plastic centrifuge tube (15 mL or 50 mL).
      Cryovial:
        description: A cryogenic storage vial for long-term freezing.
      Eppendorff:
        description: A 1.5–2 mL microcentrifuge tube.
      Conical Tube 15ml:
        description: A 15 mL conical centrifuge tube.
      Conical Tube 50ml:
        description: A 50 mL conical centrifuge tube.
      Cassette:
        description: A histology processing cassette holding tissue for embedding.
      Slide Box:
        description: A box designed to store histology slides.
      Freezer:
        description: An ultra-low temperature (ULT) or standard freezer unit.
      Refrigerator:
        description: A standard refrigerator (typically 2–8 °C).
      Shelf:
        description: A shelf within a storage unit.
      Rack:
        description: A rack for holding tubes or boxes within a freezer or refrigerator.
      Drawer:
        description: A drawer compartment within a storage unit.
  LocationType:
    description: Hierarchical categories of physical storage locations.
    permissible_values:
      Site:
        description: A top-level physical site or facility (e.g. a VA medical center campus).
      Building:
        description: A building within a site.
      Room:
        description: A room within a building.
  StainType:
    description: Immunohistochemical (IHC) stains used in histology slide preparation.
    permissible_values:
      NeuN:
        description: NeuN (Neuronal Nuclei) antibody stain; marks mature neurons.
      Iba1:
        description: Iba1 (Ionized calcium-binding adaptor molecule 1) stain; marks microglia.
      GFAP:
        description: GFAP (Glial Fibrillary Acidic Protein) stain; marks astrocytes.
  CellType:
    description: Cell types from the Cell Ontology (CL), anchored at the root cell term CL:0000000.
    reachable_from:
      source_ontology: obo:cl
      source_nodes:
        - CL:0000000
