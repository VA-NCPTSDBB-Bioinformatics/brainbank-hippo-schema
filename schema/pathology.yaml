id: https://w3id.org/VA-NCPTSDBB/brainbank/pathology
name: pathology
version: 0.1.0
description: >-
  PROVISIONAL / FUTURE WORK. Pathology scope is not yet defined (which staging scales and measures
  the bank needs to store is TBD). This module is a minimal placeholder that records the agreed
  direction only: a generic Assessment/Measurement with a MeasureType enum (rather than typed
  subclasses per scale). Do not treat the classes/enums here as final.
prefixes:
  linkml: https://w3id.org/linkml/
  mondo: http://purl.obolibrary.org/obo/MONDO_
default_prefix: pathology
default_range: string
imports:
  - linkml:types
  - core
  - person
  - tissue

classes:
  Assessment:
    abstract: true
    is_a: NamedThing
    description: A pathology assessment of a person or sample (a reified observation). PROVISIONAL.
    attributes:
      person:
        range: Person
        description: The person (donor) this assessment is about, if applicable.
      sample:
        range: Sample
        description: The tissue sample this assessment is about, if applicable.
      method:
        description: Method or protocol used to perform this assessment.
      asserted_on:
        range: date
        description: Date on which this assessment was made or recorded.

  Measurement:
    is_a: Assessment
    description: >-
      A generic neuropathology measure. PROVISIONAL. When scope is known, `measure_name` is intended
      to be constrained by the MeasureType enum below (populated then), with staged scales recorded
      as values rather than as typed subclasses.
    attributes:
      measure_name:
        range: MeasureType
        required: true
        description: The neuropathology staging scale or measure being recorded (e.g. Braak NFT stage).
      value_numeric:
        range: float
        description: Numeric value of the measurement (e.g. a Braak stage integer or continuous score).
      value_text:
        description: Text value of the measurement, for categorical or free-text scores.

  Diagnosis:
    is_a: Assessment
    description: A disease diagnosis recorded for a donor. PROVISIONAL.
    attributes:
      disease:
        range: Disease
        required: true
        description: The MONDO disease term for this diagnosis.

enums:
  Disease:
    description: >-
      Disease terms drawn from the Mondo Disease Ontology (MONDO), anchored at the root
      MONDO:0000001 (disease or disorder). Used to record diagnoses.
    reachable_from:
      source_ontology: obo:mondo
      source_nodes:
        - MONDO:0000001
  MeasureType:
    description: >-
      STUB — to be populated once pathology scope is defined (e.g. Braak NFT stage, Thal phase,
      CERAD score, McKee CTE stage, LATE-NC). Intentionally left without permissible values for now.
